<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title"><span class="accent">Boné</span>Store</h1>
        <p class="login-sub">Informe seu email para recuperar a senha</p>
      </div>
    </div>

    <form [formGroup]="formGroup" class="login-form" (ngSubmit)="enviar()" autocomplete="off">
      <div class="field-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="email" type="email" formControlName="email" placeholder="seu@email.com" autocomplete="email" />
        </div>
      </div>

      <div *ngIf="erro" class="error-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ erro }}
      </div>
      <div *ngIf="mensagem" class="success-box">{{ mensagem }}</div>

      <div class="actions">
        <button type="submit" class="btn-entrar" [disabled]="formGroup.invalid">Enviar link</button>
        <button type="button" class="btn-cadastrar" (click)="router.navigateByUrl('/login')">Voltar</button>
      </div>
    </form>
  </div>
</div>
