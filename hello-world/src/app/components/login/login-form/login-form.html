<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title"><span class="accent">Bone</span>Store</h1>
        <p class="login-sub">Faca login com seu Gmail para continuar</p>
      </div>
    </div>

    <form [formGroup]="formGroup" class="login-form" autocomplete="off">
      <div class="field-group">
        <label for="email-input">Gmail</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            id="email-input"
            type="email"
            formControlName="email"
            placeholder="seu@gmail.com"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="field-group">
        <label for="senha-input">Senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            id="senha-input"
            type="password"
            formControlName="senha"
            placeholder="sua senha"
            autocomplete="current-password"
          />
        </div>
      </div>

      @if (erro) {
        <div class="error-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ erro }}
        </div>
      }

      <div class="actions">
        <button
          type="button"
          class="btn-entrar"
          (click)="entrar()"
          [disabled]="formGroup.invalid"
        >
          Entrar
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <button type="button" class="btn-cadastrar" (click)="cadastrar()">Cadastrar</button>
      </div>

      <button type="button" class="forgot-link" (click)="esqueciSenha()">Esqueceu a senha?</button>
    </form>
  </div>
</div>
