<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title"><span class="accent">Nova</span>Senha</h1>
        <p class="login-sub">Cadastre uma senha com no minimo 6 digitos</p>
      </div>
    </div>

    <form [formGroup]="formGroup" class="login-form" (ngSubmit)="salvar()" autocomplete="off">
      <div class="field-group">
        <label for="senha">Senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="senha" type="password" formControlName="senha" placeholder="senha (min 6 digitos)" autocomplete="new-password" />
        </div>
        <div *ngIf="senhaMenorQueSeis()" class="field-error">
          A senha nao pode ter menos de 6 digitos.
        </div>
      </div>

      <div class="field-group">
        <label for="confirmar">Confirmar senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="confirmar" type="password" formControlName="confirmar" placeholder="repita a senha" autocomplete="new-password" />
        </div>
        <div *ngIf="confirmacaoDiferente()" class="field-error">
          As senhas precisam ser iguais.
        </div>
      </div>

      <div *ngIf="erro" class="error-box">{{ erro }}</div>
      <div *ngIf="mensagem" class="success-box">{{ mensagem }}</div>

      <div class="actions">
        <button type="submit" class="btn-entrar" [disabled]="formGroup.invalid || !token">Salvar senha</button>
        <button type="button" class="btn-cadastrar" (click)="router.navigateByUrl('/login')">Voltar</button>
      </div>
    </form>
  </div>
</div>
