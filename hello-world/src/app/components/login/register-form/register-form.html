<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title"><span class="accent">Bone</span>Store</h1>
        <p class="login-sub">Crie sua conta com Gmail</p>
      </div>
    </div>

    <form [formGroup]="formGroup" class="login-form" (ngSubmit)="cadastrar()" autocomplete="off">
      <div class="field-group">
        <label for="email">Gmail</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="email" type="email" formControlName="email" placeholder="seu@gmail.com" autocomplete="email" />
        </div>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="senha" type="password" formControlName="senha" placeholder="senha (min 6)" autocomplete="new-password" />
        </div>
      </div>

      <div class="field-group">
        <label for="confirmar">Confirmar senha</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="confirmar" type="password" formControlName="confirmar" placeholder="repita a senha" autocomplete="new-password" />
        </div>
      </div>

      <div *ngIf="mensagem" class="error-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ mensagem }}
      </div>
      <div *ngIf="sucesso" class="success-box">{{ sucesso }}</div>

      <div class="actions">
        <button type="submit" class="btn-entrar" [disabled]="formGroup.invalid">Cadastrar</button>
        <button type="button" class="btn-cadastrar" (click)="router.navigateByUrl('/login')">Voltar</button>
      </div>
    </form>
  </div>
</div>
