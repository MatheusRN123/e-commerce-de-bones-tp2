<div class="page-container">
  <div class="form-card">

    <div class="form-header">
      <div class="header-left">
        <h1>Editar <span class="accent">Boné</span></h1>
        <p>Atualize os dados do produto abaixo</p>
      </div>
      <button class="btn-cancel-top" type="button" routerLink="/bones">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Cancelar
      </button>
    </div>

    <form [formGroup]="formGroup" class="form">

      <!-- SEÇÃO: IDENTIFICAÇÃO -->
      <div class="section">
        <span class="section-label">Identificação</span>
        <div class="fields-row">
          <div class="field col-2">
            <label for="nome">Nome do Boné</label>
            <input id="nome" type="text" formControlName="nome" placeholder="Ex: Boné Aba Curva Premium" />
          </div>
          <div class="field col-1">
            <label for="cor">Cor</label>
            <input id="cor" type="text" formControlName="cor" placeholder="Ex: Preto" />
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- SEÇÃO: DIMENSÕES -->
      <div class="section">
        <span class="section-label">Dimensões</span>
        <div class="fields-row">
          <div class="field col-1">
            <label for="categoriaAba">Categoria da Aba</label>
            <input id="categoriaAba" type="text" formControlName="categoriaAba" placeholder="Ex: Curva" />
          </div>
          <div class="field col-1">
            <label for="tamanhoAba">Tamanho da Aba (cm)</label>
            <input id="tamanhoAba" type="number" formControlName="tamanhoAba" placeholder="Ex: 7" />
          </div>
          <div class="field col-1">
            <label for="profundidade">Profundidade (cm)</label>
            <input id="profundidade" type="number" formControlName="profundidade" placeholder="Ex: 15" />
          </div>
        </div>
        <div class="fields-row" style="margin-top: 14px;">
          <div class="field col-2">
            <label for="circunferencia">Circunferência</label>
            <input id="circunferencia" type="text" formControlName="circunferencia" placeholder="Ex: 54-60cm" />
          </div>
          <div class="field col-1">
            <label for="preco">Preço (R$)</label>
            <div class="input-prefix-wrap">
              <span class="input-prefix">R$</span>
              <input id="preco" type="number" formControlName="preco" placeholder="0,00" class="with-prefix" />
            </div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- SEÇÃO: IMAGEM -->
      <div class="section">
        <span class="section-label">Imagem do Boné</span>
        <div class="fields-row">
          <div class="field col-2">
            <label for="imagem">Selecionar Imagem</label>
            <input
              id="imagem"
              type="file"
              accept="image/*"
              (change)="onImagemSelecionada($event)"
              [disabled]="uploadandoImagem"
            />
            <span class="field-hint" *ngIf="uploadandoImagem">Enviando imagem...</span>
            <span class="field-hint success-hint" *ngIf="imagemFid && !uploadandoImagem">✓ Imagem enviada com sucesso!</span>
          </div>
          <div class="field col-1" *ngIf="previewImagem">
            <label>Prévia</label>
            <img [src]="previewImagem" class="image-preview" alt="Prévia da imagem" />
          </div>
        </div>
      </div>

      <div class="divider"></div>

  <!-- SEÇÃO: ESPECIFICAÇÕES -->
  <div class="section">
    <span class="section-label">Especificações</span>
    <div class="fields-row">

      <div class="field col-1">
        <div class="label-row">
          <label>Marca</label>
          <button type="button" class="btn-inline-add" (click)="abrirCadastroRapido('marca', $event)">+</button>
        </div>
        <div class="dropdown-wrap" [class.open]="dropdownAberto === 'marca'" (click)="$event. stopPropagation()">
          <button type="button" class="dropdown-trigger" (click)="toggleDropdown('marca')">
            <span [class.placeholder]="!formGroup.get('marca')?.value">
              {{ formGroup.get('marca')?.value?.nome ?? 'Selecione...' }}
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"   stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item"
              *ngFor="let m of marcas"
              [class.active]="formGroup.get('marca')?.value?.id === m.id"
              (click)="selecionarOpcao('marca', m)">
              {{ m.nome }}
            </button>
          </div>
        </div>
      </div>

      <div class="field col-1">
        <div class="label-row">
          <label>Modelo</label>
          <button type="button" class="btn-inline-add" (click)="abrirCadastroRapido('modelo', $event)">+</button>
        </div>
        <div class="dropdown-wrap" [class.open]="dropdownAberto === 'modelo'" (click)="$event.  stopPropagation()">
          <button type="button" class="dropdown-trigger" (click)="toggleDropdown('modelo')">
            <span [class.placeholder]="!formGroup.get('modelo')?.value">
              {{ formGroup.get('modelo')?.value?.nome ?? 'Selecione...' }}
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"   stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item"
              *ngFor="let m of modelos"
              [class.active]="formGroup.get('modelo')?.value?.id === m.id"
              (click)="selecionarOpcao('modelo', m)">
              {{ m.nome }}
            </button>
          </div>
        </div>
      </div>

      <div class="field col-1">
        <div class="label-row">
          <label>Material</label>
          <button type="button" class="btn-inline-add" (click)="abrirCadastroRapido('material', $event)">+</button>
        </div>
        <div class="dropdown-wrap" [class.open]="dropdownAberto === 'material'" (click) ="$event.stopPropagation()">
          <button type="button" class="dropdown-trigger" (click)="toggleDropdown('material')">
            <span [class.placeholder]="!formGroup.get('material')?.value">
              {{ formGroup.get('material')?.value?.nome ?? 'Selecione...' }}
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"   stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item"
              *ngFor="let m of materiais"
              [class.active]="formGroup.get('material')?.value?.id === m.id"
              (click)="selecionarOpcao('material', m)">
              {{ m.nome }}
            </button>
          </div>
        </div>
      </div>

      <div class="field col-1">
        <label>Bordado</label>
        <div class="dropdown-wrap" [class.open]="dropdownAberto === 'bordado'" (click)="$event. stopPropagation()">
          <button type="button" class="dropdown-trigger" (click)="toggleDropdown('bordado')">
            <span [class.placeholder]="!formGroup.get('bordado')?.value">
              {{ formGroup.get('bordado')?.value ? formatarBordado(formGroup.get('bordado')!. value) : 'Selecione...' }}
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"   stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu">
            <button type="button" class="dropdown-item"
              *ngFor="let b of bordados"
              [class.active]="formGroup.get('bordado')?.value === b"
              (click)="selecionarOpcao('bordado', b)">
              {{ formatarBordado(b) }}
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

      <!-- SEÇÃO: ESTOQUE E ESTAMPAS -->
      <div class="section">
        <span class="section-label">Estoque e Estampas</span>
        <div class="fields-row">

          <div class="field col-1">
            <label for="quantidadeEstoque">Quantidade em Estoque</label>
            <input
              id="quantidadeEstoque"
              type="number"
              formControlName="quantidadeEstoque"
              placeholder="Ex: 10"
              min="1"
            />
            <span class="field-hint" *ngIf="formGroup.get('quantidadeEstoque')?.touched && formGroup.get('quantidadeEstoque')?.errors?.['min']">
              Mínimo de 1 unidade.
            </span>
          </div>

          <div class="field col-2">
            <div class="label-row">
              <label>Estampas</label>
              <button type="button" class="btn-inline-add" (click)="abrirCadastroRapido('estampa', $event)">+</button>
            </div>
            <div class="estampas-list" *ngIf="estampas.length; else semEstampas">
              <label class="estampa-item" *ngFor="let e of estampas">
                <input
                  type="checkbox"
                  [value]="e.id"
                  (change)="toggleEstampa(e.id, $event)"
                  [checked]="estampasSelecionadas.includes(e.id)"
                />
                <span>{{ e.nome }}</span>
              </label>
            </div>
            <ng-template #semEstampas>
              <div class="estampas-empty">Nenhuma estampa cadastrada.</div>
            </ng-template>
          </div>

        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button class="btn-cancel" type="button" routerLink="/bones">Cancelar</button>
        <button class="btn-save" type="button" (click)="atualizar()" [disabled]="formGroup.invalid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Atualizar Boné
        </button>
      </div>

    </form>
  </div>
</div>

<div class="modal-backdrop" *ngIf="quickModal" (click)="fecharCadastroRapido()">
  <div class="quick-modal" (click)="$event.stopPropagation()" [formGroup]="quickForm">
    <div class="modal-header">
      <h2>Novo {{ quickModal }}</h2>
      <button type="button" (click)="fecharCadastroRapido()">x</button>
    </div>

    <div class="field">
      <label>Nome</label>
      <input type="text" formControlName="nome" placeholder="Nome" />
    </div>

    <ng-container *ngIf="quickModal === 'modelo'">
      <div class="fields-row">
        <div class="field col-1">
          <label>Categoria</label>
          <input type="text" formControlName="categoria" placeholder="Ex: Casual" />
        </div>
        <div class="field col-1">
          <label>Estilo</label>
          <input type="text" formControlName="estilo" placeholder="Ex: Streetwear" />
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="quickModal === 'estampa'">
      <div class="fields-row">
        <div class="field col-1">
          <label>Tipo</label>

          <div
            class="dropdown-wrap"
            [class.open]="dropdownAberto === 'tipo'"
            (click)="$event.stopPropagation()">

            <button
              type="button"
              class="dropdown-trigger"
              (click)="toggleDropdown('tipo')">

              <span>
                {{
                  quickForm.get('tipo')?.value === 'BORDADA'
                    ? 'Bordada'
                    : 'Digital'
                }}
              </span>

              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div class="dropdown-menu">

              <button
                type="button"
                class="dropdown-item"
                [class.active]="quickForm.get('tipo')?.value === 'DIGITAL'"
                (click)="selecionarTipo('DIGITAL')">
                Digital
              </button>

              <button
                type="button"
                class="dropdown-item"
                [class.active]="quickForm.get('tipo')?.value === 'BORDADA'"
                (click)="selecionarTipo('BORDADA')">
                Bordada
              </button>

            </div>

          </div>
        </div>
        <div class="field col-1">
          <label>Posicao</label>
          <input type="text" formControlName="posicao" placeholder="Frente" />
        </div>
      </div>
      <div class="field">
        <label>Descricao</label>
        <input type="text" formControlName="descricao" placeholder="Descricao" />
      </div>
      <div class="field" *ngIf="quickForm.get('tipo')?.value === 'DIGITAL'">
        <label>Resolucao</label>
        <input type="text" formControlName="resolucao" placeholder="1080p" />
      </div>
      <div class="fields-row" *ngIf="quickForm.get('tipo')?.value === 'BORDADA'">
        <div class="field col-1">
          <label>Cor da linha</label>
          <input type="text" formControlName="corLinha" placeholder="Branco" />
        </div>
        <div class="field col-1">
          <label>Qtd. cores</label>
          <input type="number" formControlName="quantCores" placeholder="1" />
        </div>
      </div>
    </ng-container>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="fecharCadastroRapido()">Cancelar</button>
      <button type="button" class="btn-save" (click)="salvarCadastroRapido()">Adicionar</button>
    </div>
  </div>
</div>
